<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="/"><title>イベント検証（保存なし）</title><link rel="stylesheet" href="src/css/style.css"></head><body>
<script type="module">
// Local-only manual integration fixture. Never initialize Firebase or real storage.
if (!['localhost','127.0.0.1'].includes(location.hostname)) throw Error('Local preview only');
const memory=new Map();
Object.defineProperty(window,'localStorage',{value:{getItem:k=>memory.get(k)??null,setItem:(k,v)=>memory.set(k,String(v)),removeItem:k=>memory.delete(k)}});
let now=Date.parse('2026-10-01T00:00:00+09:00');
Date.now=()=>now;
const html=new DOMParser().parseFromString(await (await fetch('index.html')).text(),'text/html');
html.querySelectorAll('script').forEach(s=>s.remove());
document.body.replaceChildren(...html.body.childNodes);
document.querySelectorAll('.boot-screen,#bootError').forEach(e=>e.remove());
document.querySelector('#app').classList.add('ready');
document.querySelector('#app').removeAttribute('aria-hidden');
const S=await import('/src/js/core/state.js');
S.state.materials.mt_halloween_candy=3000;
S.state.orb=500;S.state.stamina=999;S.state.profile.name='検証用（保存なし）';
const N=await import('/src/js/core/nav.js');
const E=await import('/src/js/screens/event.js');
const Shop=await import('/src/js/screens/shop.js');
const Home=await import('/src/js/screens/home.js');
const G=await import('/src/js/screens/gacha.js');
const D=await import('/src/js/screens/dungeon.js');
const B=await import('/src/js/battle/battle.js');
N.registerScreen('event',E.renderEvent);N.registerScreen('shop',Shop.renderShop);
N.registerScreen('home',Home.renderHome);
N.registerScreen('gacha',G.renderGacha);N.registerScreen('dungeon',D.renderDungeon);
N.initNav();Home.initHome();G.initGacha();D.initDungeon();B.initBattle();
const controls=document.createElement('div');
controls.style='position:relative;background:#30203d;padding:10px;font-size:12px';
controls.innerHTML=`<b>ローカル検証・セーブ／クラウド接続なし</b><br><select id="testDate"><option value="2026-10-01T00:00:00+09:00">開催中 10/1</option><option value="2026-09-30T23:59:59+09:00">開始直前</option><option value="2026-11-01T00:00:00+09:00">終了時刻</option></select> <button data-test-screen="event">イベント</button> <button data-test-screen="shop">ショップ</button> <button data-test-screen="home">ホーム</button> <button data-test-screen="gacha">ガチャ</button><output id="testInventory"></output>`;
document.querySelector('#app').prepend(controls);
controls.querySelector('#testDate').onchange=e=>{now=Date.parse(e.target.value);N.showScreen('event');};
controls.querySelectorAll('[data-test-screen]').forEach(b=>b.onclick=()=>N.showScreen(b.dataset.testScreen));
const report=()=>document.querySelector('#testInventory').textContent=` キャンディ:${S.state.materials.mt_halloween_candy} キュウコ:${S.state.characters.hw_kyuko?.n||0} 背景:${S.state.settings.homeThemeId||'default'}`;
S.onSave(report);report();N.showScreen('event');
</script></body></html>
